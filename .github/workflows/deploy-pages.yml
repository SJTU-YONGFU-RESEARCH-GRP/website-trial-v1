# GitHub Pages: build Vite app (any branch) and deploy (main/master only)
# Repo: https://github.com/SJTU-YONGFU-RESEARCH-GRP/website-trial-v1
#
# Site URL: https://sjtu-yongfu-research-grp.github.io/website-trial-v1/
#
# Setup (once): Settings → Pages → Build and deployment → Source: GitHub Actions

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, dhc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout spice_model_benchmark (results only)
        uses: actions/checkout@v4
        with:
          repository: SJTU-YONGFU-RESEARCH-GRP/spice_model_benchmark
          path: external/spice_model_benchmark
          sparse-checkout: |
            results
            reference_results
            netlists
            README.md
          sparse-checkout-cone-mode: false

      - name: Checkout new-spice-translator (docs only)
        uses: actions/checkout@v4
        with:
          repository: SJTU-YONGFU-RESEARCH-GRP/new-spice-translator
          path: external/new-spice-translator
          sparse-checkout: |
            docs/finalbatchrun2
            output/**/plots/**/*.png
            output/**/plots/**/*.svg
            output/**/verification_summary.png
            output/verification_summary.png
            README.md
          sparse-checkout-cone-mode: false

      # Optional: add npm cache after package-lock.json is stable in git:
      #   with:
      #     cache: npm
      #     cache-dependency-path: package-lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build
        env:
          SPICE_BENCHMARK_SOURCE: external/spice_model_benchmark
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
